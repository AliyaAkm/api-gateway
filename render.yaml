services:
  - type: web
    name: education-gateway
    runtime: go
    plan: starter
    autoDeployTrigger: commit
    buildCommand: go build -o bin/gateway ./cmd/gateway
    startCommand: ./bin/gateway
    healthCheckPath: /api/v1/health
    envVars:
      - key: SERVICE_NAME
        value: education-gateway
      - key: HTTP_ADDR
        value: :8090
      - key: READ_TIMEOUT
        value: 5s
      - key: WRITE_TIMEOUT
        value: 15s
      - key: IDLE_TIMEOUT
        value: 60s
      - key: SHUTDOWN_TIMEOUT
        value: 10s
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ALLOWED_METHODS
        value: GET,POST,PUT,PATCH,DELETE,OPTIONS
      - key: CORS_ALLOWED_HEADERS
        value: Authorization,Content-Type,X-Request-ID
      - key: AUTH_SERVICE_URL
        fromService:
          type: pserv
          name: auth-service
          property: hostport
      - key: CURRICULUM_SERVICE_URL
        fromService:
          type: pserv
          name: curriculum-service
          property: hostport
      - key: PAYMENT_SERVICE_URL
        fromService:
          type: pserv
          name: payment-service
          property: hostport
